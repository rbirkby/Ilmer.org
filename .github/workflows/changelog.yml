name: Changelog

# Regenerates CHANGELOG.md from the Conventional Commits on main and commits it back.
# Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a run still in progress; it regenerates from the latest main anyway.
concurrency:
  group: changelog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      # The generator has no dependencies, so no npm ci.
      - name: Generate CHANGELOG.md
        run: node --run changelog

      - name: Commit CHANGELOG.md if it changed
        run: |
          if git diff --quiet -- CHANGELOG.md && git ls-files --error-unmatch CHANGELOG.md > /dev/null 2>&1; then
            echo "CHANGELOG.md is up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'chore(changelog): update CHANGELOG.md'
          git push origin HEAD:main
