name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Check code formatting
        run: npm run format-check

      - name: Lint code
        run: npm run lint-check

      - name: Validate data against JSON schemas
        run: npm run validate:schema

      - name: Validate historical events
        run: npm run lint:events

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: npm run link-check:internal

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          retention-days: 1

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site/

      - name: Accessibility audit (pour)
        env:
          # pour-cli has no flag for Chrome args; our a11y script wraps the
          # binary with --no-sandbox when CI=true (required on Ubuntu runners).
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          POUR_CHROME_NO_SANDBOX: '1'
        run: npm run a11y

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site/

      - name: Run Lighthouse audit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
