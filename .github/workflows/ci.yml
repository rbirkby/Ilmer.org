name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Check code formatting
        run: npm run format-check

      - name: Lint code
        run: npm run lint-check

      - name: Validate data against JSON schemas
        run: npm run validate:schema

      - name: Validate historical events
        run: npm run lint:events

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: npm run link-check:internal

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          retention-days: 1

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'agent/.node-version'
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site/

      - name: Type-check
        run: npm run check

      # Without Workers AI, offline dev serves everything but model answers, so the
      # end-to-end Poppy tests run with no Cloudflare credentials.
      - name: Start offline dev server
        run: |
          ILMER_POPPY_OFFLINE=true npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/.well-known/poppy.json > /dev/null && exit 0
            sleep 2
          done
          cat dev.log
          exit 1

      - name: Run unit and end-to-end tests
        env:
          POPPY_E2E_ORIGIN: http://localhost:8787
        run: npm test

      - name: Show dev server log
        if: failure()
        run: cat dev.log

      # Builds the Worker and its knowledge corpus from the built site; uploads nothing.
      - name: Dry-run deploy
        run: npm run deploy:dry-run

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site/

      - name: Accessibility audit (pour)
        env:
          # pour-cli has no flag for Chrome args; our a11y script wraps the
          # binary with --no-sandbox when CI=true (required on Ubuntu runners).
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          POUR_CHROME_NO_SANDBOX: '1'
        run: npm run a11y

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site/

      - name: Run Lighthouse audit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
