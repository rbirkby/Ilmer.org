    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask the Ilmer Past archive about the history of Ilmer, Buckinghamshire." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Ask Ilmer Past</title>
    <script>
      try {
        const mode =
          localStorage.getItem('theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.mode = mode;
        document.documentElement.style.colorScheme = mode;
      } catch {}
    </script>

    <script type="module" src="/client/client.tsx"></script>
  </body>
